name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify
        run: bun run verify
      - name: The tag names the package version
        run: |
          published="$(node -p 'require("./packages/nf/package.json").version')"
          if [ "v${published}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name @p-otero/nf-stack ${published}"
            exit 1
          fi
          echo "@p-otero/nf-stack ${published}"
      - name: Build
        run: bun run package:build
      - name: Authenticate npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm $(npm --version)"
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${RUNNER_TEMP}/npmrc"
            echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/npmrc" >> "${GITHUB_ENV}"
            echo "publishing with the NPM_TOKEN secret"
          else
            echo "publishing with npm trusted publishing (OIDC, no token)"
          fi
      - name: Publish
        working-directory: packages/nf
        run: npm publish --provenance --access public

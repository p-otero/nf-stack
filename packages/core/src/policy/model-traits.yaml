# Model traits for `nf policy propose`. A pattern is a glob over the model id as the catalog
# lists it (`*` matches any run of characters); the first matching entry wins, so keep the more
# specific patterns above the family ones. Options and ranks are per profile: a lower rank is a
# better fit and `options` are the provider's native option values to propose for that profile.
# A profile a model has no entry for is one it is not suitable for, and it is never proposed
# there. A model without a matching entry is unclassified and never added to a policy
# automatically. A proposal keeps at most `limit` candidates per profile: existing ones are never
# removed or moved, and the free slots go to the best-ranked routes.
version: 1

profiles: [bounded, reasoning, lookup, review, frontier]

limit: 6

models:
  - pattern: "opencode-go/deepseek-v4.1-flash"
    family: deepseek-v4.1-flash
    openrouter: deepseek/deepseek-v4.1-flash
    reasoning: true
    reasoning_options: [thinking]
    context_window: 160000
    profiles:
      bounded: { rank: 1, options: { thinking: max } }
      lookup: { rank: 2, options: { thinking: max } }
      review: { rank: 6, options: { thinking: high } }

  - pattern: "opencode-go/glm-5.3-flash"
    family: glm-5.3-flash
    openrouter: z-ai/glm-5.3-flash
    reasoning: true
    reasoning_options: [thinking]
    context_window: 200000
    profiles:
      bounded: { rank: 2, options: { thinking: max } }
      lookup: { rank: 4, options: { thinking: max } }

  - pattern: "*/gpt-6-luna"
    family: gpt-6-luna
    openrouter: openai/gpt-6-luna
    reasoning: true
    reasoning_options: [thinking]
    context_window: 200000
    profiles:
      bounded: { rank: 3, options: { thinking: medium }, max: { thinking: high } }
      lookup: { rank: 1, options: { thinking: medium } }

  - pattern: "gpt-6-luna"
    family: gpt-6-luna
    openrouter: openai/gpt-6-luna
    reasoning: true
    reasoning_options: [reasoningEffort]
    context_window: 200000
    profiles:
      bounded: { rank: 3, options: { reasoningEffort: medium }, max: { reasoningEffort: high } }
      lookup: { rank: 1, options: { reasoningEffort: medium } }

  - pattern: "claude-haiku-5-5"
    family: claude-haiku-5.5
    openrouter: anthropic/claude-haiku-5.5
    reasoning: true
    reasoning_options: [effort]
    context_window: 200000
    profiles:
      bounded: { rank: 4, options: { effort: medium } }
      lookup: { rank: 3, options: { effort: low } }

  - pattern: "claude-sonnet-5-5"
    family: claude-sonnet-5.5
    openrouter: anthropic/claude-sonnet-5.5
    reasoning: true
    reasoning_options: [effort]
    context_window: 1000000
    profiles:
      bounded: { rank: 5, options: { effort: high } }
      reasoning: { rank: 4, options: { effort: high }, max: { effort: xhigh } }
      review: { rank: 4, options: { effort: high }, max: { effort: xhigh } }

  - pattern: "*/gpt-6.1-sol"
    family: gpt-6.1-sol
    openrouter: openai/gpt-6.1-sol
    reasoning: true
    reasoning_options: [thinking]
    context_window: 400000
    profiles:
      reasoning: { rank: 1, options: { thinking: medium }, max: { thinking: high } }
      review: { rank: 3, options: { thinking: high } }

  - pattern: "gpt-6.1-sol"
    family: gpt-6.1-sol
    openrouter: openai/gpt-6.1-sol
    reasoning: true
    reasoning_options: [reasoningEffort]
    context_window: 400000
    profiles:
      reasoning: { rank: 1, options: { reasoningEffort: medium }, max: { reasoningEffort: high } }
      review: { rank: 3, options: { reasoningEffort: high } }

  - pattern: "zai/glm-5.3"
    family: glm-5.3
    openrouter: z-ai/glm-5.3
    reasoning: true
    reasoning_options: [thinking]
    context_window: 200000
    profiles:
      reasoning: { rank: 2, options: { thinking: high } }
      review: { rank: 1, options: { thinking: high } }

  - pattern: "*/gpt-6.1-terra"
    family: gpt-6.1-terra
    openrouter: openai/gpt-6.1-terra
    reasoning: true
    reasoning_options: [thinking]
    context_window: 200000
    profiles:
      reasoning: { rank: 3, options: { thinking: high } }
      review: { rank: 2, options: { thinking: high } }

  - pattern: "gpt-6.1-terra"
    family: gpt-6.1-terra
    openrouter: openai/gpt-6.1-terra
    reasoning: true
    reasoning_options: [reasoningEffort]
    context_window: 200000
    profiles:
      reasoning: { rank: 3, options: { reasoningEffort: high } }
      review: { rank: 2, options: { reasoningEffort: high } }

  - pattern: "claude-opus-5-5"
    family: claude-opus-5.5
    openrouter: anthropic/claude-opus-5.5
    reasoning: true
    reasoning_options: [effort]
    context_window: 1000000
    profiles:
      reasoning: { rank: 5, options: { effort: high }, max: { effort: xhigh } }

  - pattern: "claude-fable-5-2"
    family: claude-fable-5.2
    openrouter: anthropic/claude-fable-5.2
    reasoning: true
    reasoning_options: [effort]
    context_window: 1000000
    profiles:
      frontier: { rank: 1, options: { effort: max } }

  - pattern: "*/gpt-6-astra"
    family: gpt-6-astra
    openrouter: openai/gpt-6-astra
    reasoning: true
    reasoning_options: [thinking]
    context_window: 400000
    profiles:
      frontier: { rank: 2, options: { thinking: high } }

  - pattern: "gpt-6-astra"
    family: gpt-6-astra
    openrouter: openai/gpt-6-astra
    reasoning: true
    reasoning_options: [reasoningEffort]
    context_window: 400000
    profiles:
      frontier: { rank: 2, options: { reasoningEffort: high } }
